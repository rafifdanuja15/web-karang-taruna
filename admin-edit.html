<!DOCTYPE html>
<html class="scroll-smooth" lang="id">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Aktivitas - Portal Admin Karang Taruna</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">

      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error": "#ba1a1a",
            "surface-container": "#e5eeff",
            "on-secondary-container": "#5c2400",
            "secondary-fixed-dim": "#ffb690",
            "outline": "#757682",
            "surface-tint": "#4059aa",
            "on-primary-fixed": "#00164e",
            "surface": "#f8f9ff",
            "outline-variant": "#c5c5d3",
            "secondary": "#9d4300",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#ffdbca",
            "tertiary-container": "#004565",
            "inverse-on-surface": "#eaf1ff",
            "on-background": "#0b1c30",
            "on-tertiary-fixed": "#001e2f",
            "on-error": "#ffffff",
            "inverse-surface": "#213145",
            "on-surface-variant": "#444651",
            "error-container": "#ffdad6",
            "background": "#f8f9ff",
            "on-tertiary-fixed-variant": "#004c6e",
            "surface-container-highest": "#d3e4fe",
            "tertiary": "#002e44",
            "on-tertiary-container": "#36b6fb",
            "surface-variant": "#d3e4fe",
            "primary-fixed": "#dce1ff",
            "on-surface": "#0b1c30",
            "surface-container-low": "#eff4ff",
            "primary-fixed-dim": "#b6c4ff",
            "on-primary": "#ffffff",
            "surface-bright": "#f8f9ff",
            "on-primary-container": "#90a8ff",
            "inverse-primary": "#b6c4ff",
            "on-error-container": "#93000a",
            "primary": "#00236f",
            "primary-container": "#1e3a8a",
            "surface-container-lowest": "#ffffff",
            "tertiary-fixed": "#c9e6ff",
            "on-primary-fixed-variant": "#264191",
            "surface-container-high": "#dce9ff",
            "on-secondary-fixed-variant": "#783200",
            "on-secondary-fixed": "#341100",
            "tertiary-fixed-dim": "#89ceff",
            "on-secondary": "#ffffff",
            "secondary-container": "#fd761a",
            "surface-dim": "#cbdbf5"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "sm": "8px",
            "margin-mobile": "16px",
            "xxl": "80px",
            "lg": "24px",
            "max-width": "1200px",
            "xl": "40px",
            "gutter": "24px",
            "xs": "4px",
            "md": "16px",
            "margin-desktop": "auto",
            "base": "4px"
          },
          fontFamily: {
            sans: ["Hanken Grotesk", "sans-serif"]

        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-size: 24px;
    }
  </style>
</head>
<body class="bg-background text-on-background font-sans antialiased min-h-screen">
  <header class="bg-surface-container-lowest border-b border-outline-variant sticky top-0 z-40">
    <div class="max-w-max-width mx-auto px-4 md:px-lg h-16 flex items-center justify-between">
      <a href="admin.html" class="flex items-center gap-sm">
        <img src="logo.jpg" alt="Logo" class="h-9 w-auto rounded-md">
        <span class="text-lg font-extrabold text-primary">Portal Admin</span>
      </a>
      <div class="flex items-center gap-md">
        <a href="index.html" target="_blank" class="hidden sm:inline text-sm font-semibold text-on-surface-variant hover:text-primary">Lihat website</a>
        <span id="who" class="hidden sm:inline text-sm text-outline"></span>
        <button id="logout" type="button" class="border border-primary/30 text-primary hover:bg-primary hover:text-on-primary px-md py-sm rounded-full font-bold text-sm transition-all">Keluar</button>
      </div>
    </div>
  </header>
  <div id="toast" class="hidden" role="status"></div>
  <main class="max-w-max-width mx-auto px-4 md:px-lg py-lg flex flex-col gap-lg">
    <div>
      <a href="admin.html" class="text-sm font-bold text-secondary hover:underline inline-flex items-center gap-xs"><span class="material-symbols-outlined text-lg">arrow_back</span>Kembali ke daftar</a>
      <h1 id="page-title" class="text-primary text-2xl md:text-3xl font-extrabold mt-xs">Tambah aktivitas</h1>
    </div>
    <form id="form" class="grid grid-cols-1 lg:grid-cols-3 gap-lg items-start">
      <div class="lg:col-span-2 flex flex-col gap-lg">
        <section class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-lg flex flex-col gap-md">
          <div><label class="block text-sm font-bold text-primary mb-xs" for="title">Judul kegiatan</label>
            <input id="title" required minlength="3" maxlength="150" class="w-full bg-[#F1F5F9] border border-outline-variant/60 rounded-lg px-md py-sm text-sm focus:border-primary focus:ring-2 focus:ring-primary/20" placeholder="Contoh: Gotong Royong Kebersihan Pekon"></div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
            <div><label class="block text-sm font-bold text-primary mb-xs" for="category">Kategori</label><select id="category" class="w-full bg-[#F1F5F9] border border-outline-variant/60 rounded-lg px-md py-sm text-sm focus:border-primary focus:ring-2 focus:ring-primary/20"></select></div>
            <div><label class="block text-sm font-bold text-primary mb-xs" for="event_date">Tanggal kegiatan</label><input id="event_date" type="date" class="w-full bg-[#F1F5F9] border border-outline-variant/60 rounded-lg px-md py-sm text-sm focus:border-primary focus:ring-2 focus:ring-primary/20"></div>
          </div>
          <div><label class="block text-sm font-bold text-primary mb-xs" for="schedule_label">Keterangan jadwal <span class="font-normal text-outline">(opsional, tampil jika tanggal kosong)</span></label>
            <input id="schedule_label" maxlength="60" class="w-full bg-[#F1F5F9] border border-outline-variant/60 rounded-lg px-md py-sm text-sm focus:border-primary focus:ring-2 focus:ring-primary/20" placeholder="Contoh: Rutin Bulanan"></div>
          <div><div class="flex justify-between"><label class="block text-sm font-bold text-primary mb-xs" for="summary">Ringkasan</label><span id="summary-count" class="text-xs text-outline"></span></div>
            <textarea id="summary" required rows="2" maxlength="300" class="w-full bg-[#F1F5F9] border border-outline-variant/60 rounded-lg px-md py-sm text-sm focus:border-primary focus:ring-2 focus:ring-primary/20" placeholder="Satu-dua kalimat yang tampil di kartu aktivitas"></textarea></div>
          <div><label class="block text-sm font-bold text-primary mb-xs" for="description">Deskripsi lengkap</label>
            <textarea id="description" rows="10" maxlength="10000" class="w-full bg-[#F1F5F9] border border-outline-variant/60 rounded-lg px-md py-sm text-sm focus:border-primary focus:ring-2 focus:ring-primary/20" placeholder="Ceritakan kegiatannya..."></textarea>
            <p class="text-xs text-outline mt-xs">Pisahkan paragraf dengan satu baris kosong. Awali paragraf dengan tanda &gt; untuk membuat kutipan.</p></div>
        </section>
        <section class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-lg flex flex-col gap-md">
          <div class="flex items-center justify-between">
            <div><h2 class="text-primary font-bold">Foto kegiatan</h2><p class="text-xs text-outline">Foto pertama menjadi sampul. Ukuran foto dikecilkan otomatis.</p></div>
            <span id="count" class="text-xs text-outline"></span>
          </div>
          <div id="gallery" class="grid grid-cols-2 sm:grid-cols-3 gap-md"></div>
          <label class="cursor-pointer border-2 border-dashed border-outline-variant hover:border-primary rounded-xl py-lg flex flex-col items-center gap-xs text-on-surface-variant hover:text-primary transition-colors">
            <span class="material-symbols-outlined text-3xl">add_photo_alternate</span>
            <span class="text-sm font-bold">Pilih foto</span>
            <input id="files" type="file" accept="image/*" multiple class="sr-only">
          </label>
        </section>
      </div>
      <aside class="bg-surface-container-lowest border border-outline-variant/40 rounded-2xl p-lg flex flex-col gap-md lg:sticky lg:top-24">
        <h2 class="text-primary font-bold">Publikasi</h2>
        <label class="flex items-start gap-sm cursor-pointer"><input id="is_published" type="checkbox" checked class="mt-1 w-4 h-4 accent-primary">
          <span class="text-sm text-on-surface-variant"><strong class="text-primary">Tampilkan di website</strong><br>Hilangkan centang untuk menyimpan sebagai draf.</span></label>
        <button id="save" type="submit" class="bg-secondary text-on-secondary py-sm rounded-full font-bold hover:opacity-90 disabled:opacity-50">Simpan aktivitas</button>
        <a href="admin.html" class="text-center text-sm font-bold text-on-surface-variant hover:text-primary">Batal</a>
      </aside>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script src="js/admin-common.js"></script>
  <script src="js/admin-edit.js"></script>
</body>
</html>
