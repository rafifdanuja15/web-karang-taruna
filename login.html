<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Karang Taruna Purabhakti Pekon Purajaya</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts & Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet">
  
  <!-- Tailwind Configuration matching the landing page theme -->
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "error": "#ba1a1a",
            "surface-container": "#e5eeff",
            "on-secondary-container": "#5c2400",
            "secondary-fixed-dim": "#ffb690",
            "outline": "#757682",
            "surface-tint": "#4059aa",
            "on-primary-fixed": "#00164e",
            "surface": "#f8f9ff",
            "outline-variant": "#c5c5d3",
            "secondary": "#9d4300",
            "on-tertiary": "#ffffff",
            "secondary-fixed": "#ffdbca",
            "tertiary-container": "#004565",
            "inverse-on-surface": "#eaf1ff",
            "on-background": "#0b1c30",
            "on-tertiary-fixed": "#001e2f",
            "on-error": "#ffffff",
            "inverse-surface": "#213145",
            "on-surface-variant": "#444651",
            "error-container": "#ffdad6",
            "background": "#f8f9ff",
            "on-tertiary-fixed-variant": "#004c6e",
            "surface-container-highest": "#d3e4fe",
            "tertiary": "#002e44",
            "on-tertiary-container": "#36b6fb",
            "surface-variant": "#d3e4fe",
            "primary-fixed": "#dce1ff",
            "on-surface": "#0b1c30",
            "surface-container-low": "#eff4ff",
            "primary-fixed-dim": "#b6c4ff",
            "on-primary": "#ffffff",
            "surface-bright": "#f8f9ff",
            "on-primary-container": "#90a8ff",
            "inverse-primary": "#b6c4ff",
            "on-error-container": "#93000a",
            "primary": "#00236f",
            "primary-container": "#1e3a8a",
            "surface-container-lowest": "#ffffff",
            "tertiary-fixed": "#c9e6ff"
          },
          fontFamily: {
            sans: ["Hanken Grotesk", "sans-serif"]
          }
        }
      }
    }
  </script>
  
  <style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined', sans-serif;
      font-size: 20px;
      vertical-align: middle;
    }
    /* Animated subtle background blobs */
    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-15px) scale(1.03); }
    }
    .animate-float-slow {
      animation: float 8s ease-in-out infinite;
    }
    .animate-float-reverse {
      animation: float 10s ease-in-out infinite reverse;
    }
  </style>
</head>
<body class="bg-background text-on-background font-sans min-h-full flex flex-col justify-between selection:bg-secondary selection:text-on-secondary relative overflow-x-hidden">

  <!-- Ambient Decorative Background Gradients -->
  <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-primary/10 rounded-full blur-3xl animate-float-slow"></div>
    <div class="absolute top-1/2 -right-32 w-96 h-96 bg-secondary/10 rounded-full blur-3xl animate-float-reverse"></div>
    <div class="absolute -bottom-32 left-1/3 w-96 h-96 bg-surface-tint/10 rounded-full blur-3xl animate-float-slow"></div>
  </div>

  <!-- Top Navigation Header / Back Button -->
  <header class="relative z-10 w-full p-4 md:p-6 max-w-7xl mx-auto flex items-center justify-between">
    <a href="index.html" class="inline-flex items-center gap-2 text-primary hover:text-secondary font-bold text-sm transition-all group bg-surface-container-lowest/70 backdrop-blur-md px-4 py-2 rounded-full border border-outline-variant/40 shadow-sm hover:shadow">
      <span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
      <span>Kembali ke Beranda</span>
    </a>
    <div class="text-xs text-on-surface-variant font-semibold hidden sm:block">
      Pekon Purajaya, Lampung Barat
    </div>
  </header>

  <!-- Main Login Container (Centered Card) -->
  <main class="relative z-10 flex-grow flex items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-md">
      
      <!-- Login Card -->
      <div class="bg-surface-container-lowest/85 backdrop-blur-xl border border-outline-variant/50 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden transition-all">
        
        <!-- Top Accent Bar -->
        <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-primary via-surface-tint to-secondary"></div>

        <!-- Header Content -->
        <div class="flex flex-col items-center text-center mb-8">
          <!-- Icon Header (Replacing Logo) -->
          <div class="relative mb-3">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary to-primary-container text-on-primary flex items-center justify-center shadow-lg shadow-primary/20 border border-white/20">
              <span class="material-symbols-outlined text-3xl">admin_panel_settings</span>
            </div>
          </div>
          
          <h1 class="text-2xl sm:text-3xl font-extrabold text-primary tracking-tight">
            Portal Admin
          </h1>
          <p class="text-sm text-on-surface-variant font-medium mt-1">
            Karang Taruna Purabhakti • Pekon Purajaya
          </p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-2xl text-sm border transition-all duration-300 flex items-start gap-3">
          <span id="alert-icon" class="material-symbols-outlined shrink-0 text-xl"></span>
          <div id="alert-text" class="flex-grow font-medium"></div>
          <button type="button" id="alert-close" class="text-xs opacity-60 hover:opacity-100">
            <span class="material-symbols-outlined text-base">close</span>
          </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-5" onsubmit="return false;" novalidate>
          
          <!-- Email / Username Input -->
          <div>
            <label for="username" class="block text-xs font-bold uppercase tracking-wider text-primary mb-1.5">
              Email atau Username
            </label>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                <span class="material-symbols-outlined">person</span>
              </div>
              <input 
                type="text" 
                id="username" 
                name="username"
                placeholder="Masukkan email atau username"
                class="w-full pl-11 pr-4 py-3 bg-surface text-on-surface text-sm rounded-xl border border-outline-variant/60 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant/80 outline-none"
                required
              >
            </div>
          </div>

          <!-- Password Input -->
          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label for="password" class="block text-xs font-bold uppercase tracking-wider text-primary">
                Kata Sandi
              </label>
              <button 
                type="button" 
                id="forgot-password-btn"
                class="text-xs font-semibold text-secondary hover:underline focus:outline-none"
              >
                Lupa Password?
              </button>
            </div>
            <div class="relative">
              <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-outline">
                <span class="material-symbols-outlined">lock</span>
              </div>
              <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="••••••••"
                class="w-full pl-11 pr-11 py-3 bg-surface text-on-surface text-sm rounded-xl border border-outline-variant/60 focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant/80 outline-none"
                required
              >
              <!-- Show/Hide Password Toggle Button -->
              <button 
                type="button" 
                id="toggle-password" 
                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-outline hover:text-primary transition-colors focus:outline-none"
                title="Tampilkan / Sembunyikan Password"
              >
                <span id="password-toggle-icon" class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>

          <!-- Remember Me Checkbox -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input 
                type="checkbox" 
                id="remember" 
                class="w-4 h-4 text-primary bg-surface border-outline-variant rounded focus:ring-primary/20 accent-primary"
              >
              <span class="text-xs font-semibold text-on-surface-variant">Ingat Saya</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button 
            type="submit" 
            id="submit-btn"
            class="w-full bg-primary hover:bg-primary-container text-on-primary font-bold py-3.5 px-4 rounded-xl shadow-lg hover:shadow-xl active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 group cursor-pointer"
          >
            <!-- Normal Text -->
            <span id="btn-text" class="flex items-center gap-2">
              <span>Masuk sebagai Admin</span>
              <span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">login</span>
            </span>

            <!-- Spinner Loading State -->
            <span id="btn-spinner" class="hidden items-center gap-2">
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Memproses...</span>
            </span>
          </button>

        </form>

      </div>

      <!-- Security / Footer Disclaimer -->
      <div class="text-center mt-6 text-xs text-outline">
        <p class="flex items-center justify-center gap-1">
          <span class="material-symbols-outlined text-sm">shield</span>
          <span>Area Terbatas • Sistem Terenkripsi Pekon Purajaya</span>
        </p>
      </div>

    </div>
  </main>

  <!-- Footer Info -->
  <footer class="relative z-10 py-4 text-center text-xs text-on-surface-variant/70">
    © 2026 Karang Taruna Purabhakti Pekon Purajaya. All Rights Reserved.
  </footer>

  <!-- Interactivity & Form Handling Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordToggleIcon = document.getElementById('password-toggle-icon');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const forgotBtn = document.getElementById('forgot-password-btn');

      // Alert Box Elements
      const alertBox = document.getElementById('alert-box');
      const alertIcon = document.getElementById('alert-icon');
      const alertText = document.getElementById('alert-text');
      const alertClose = document.getElementById('alert-close');

      // 1. Password Visibility Toggle
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        passwordToggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });

      // 2. Alert Box Display Function
      function showAlert(type, message) {
        alertBox.classList.remove('hidden', 'bg-error-container', 'text-on-error-container', 'border-error/30', 'bg-surface-container-highest', 'text-primary', 'border-primary/30', 'bg-surface-container');
        
        if (type === 'error') {
          alertBox.classList.add('bg-error-container', 'text-on-error-container', 'border-error/30');
          alertIcon.textContent = 'error';
        } else if (type === 'success') {
          alertBox.classList.add('bg-surface-container-highest', 'text-primary', 'border-primary/30');
          alertIcon.textContent = 'check_circle';
        } else if (type === 'info') {
          alertBox.classList.add('bg-surface-container', 'text-primary', 'border-primary/30');
          alertIcon.textContent = 'info';
        }

        alertText.innerHTML = message;
        alertBox.classList.remove('hidden');
      }

      // Close Alert
      alertClose.addEventListener('click', () => {
        alertBox.classList.add('hidden');
      });

      // 3. Forgot Password Link
      forgotBtn.addEventListener('click', () => {
        showAlert('info', 'Silakan hubungi <strong>Administrator Sistem Pekon Purajaya</strong> untuk pengaturan ulang kata sandi Anda.');
      });

      // 4. Form Submission Handling
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();

        // Validation Check
        if (!username || !password) {
          showAlert('error', 'Harap isi <strong>Email/Username</strong> dan <strong>Kata Sandi</strong>.');
          return;
        }

        // Set Loading State
        submitBtn.disabled = true;
        btnText.classList.add('hidden');
        btnSpinner.classList.remove('hidden');
        btnSpinner.classList.add('flex');
        alertBox.classList.add('hidden');

        // Simulate API / Authentication Delay (1.2 Seconds)
        setTimeout(() => {
          submitBtn.disabled = false;
          btnText.classList.remove('hidden');
          btnSpinner.classList.add('hidden');
          btnSpinner.classList.remove('flex');

          // Successful Submission Simulation
          showAlert('success', '<strong>Login Berhasil!</strong> Mengalihkan ke Halaman Utama...');
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);

        }, 1200);
      });
    });
  </script>
</body>
</html>
